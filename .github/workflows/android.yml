name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 2026 के नियमों के अनुसार नवीनतम चेकआउट टूल
    - uses: actions/checkout@v4

    - name: Unzip Project Files Properly
      run: |
        unzip -o termux-app-master.zip
        # सटीक फ़ोल्डर स्ट्रक्चर ढूँढकर फाइलों को बाहर निकालना
        TARGET_DIR=$(find . -maxdepth 2 -type d -name "termux-app-master" | head -n 1)
        if [ ! -z "$TARGET_DIR" ]; then
          echo "Found project folder at $TARGET_DIR, moving files..."
          mv $TARGET_DIR/* . 2>/dev/null || true
          mv $TARGET_DIR/.[!.]* . 2>/dev/null || true
        fi

    # नवीनतम जावा 17 सेटअप गाइडलाइंस के अनुसार v5 का उपयोग
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
        # सुनिश्चित करें कि ग्रैडलर रूट पर मौजूद हो
        LOCAL_GRADLEW=$(find . -name "gradlew" | head -n 1)
        if [ "$LOCAL_GRADLEW" != "./gradlew" ]; then
          cp $LOCAL_GRADLEW ./ 2>/dev/null || true
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Termux-APK
        path: "**/build/outputs/apk/debug/*.apk"
        
