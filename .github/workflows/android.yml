name: Build Turmux RTX APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 9 + AGP 8.13 need JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and platform packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Signed, installable release APKs (universal plus a small per-ABI APK for each CPU type).
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: "1"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/apk/debug/*universal*.apk dist/
          cd dist && sha256sum *.apk > SHA256SUMS.txt && ls -lh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TurmuxRTX-APK
          path: dist/*.apk
          if-no-files-found: error
